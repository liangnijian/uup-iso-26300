name: 自动运行

on:
  schedule:
    - cron: '30 18 * * 2'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: 整合 uup
        run: .\auto-run.cmd
        shell: cmd

      - name: 上传 iso
        uses: actions/upload-artifact@v7
        with:
          name: uup-iso
          path: "*.iso"
